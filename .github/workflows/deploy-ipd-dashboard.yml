name: Deploy IPD dashboard to GitHub Pages

on:
  push:
    branches: [codex/ipd-visual-admission-dashboard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ipd-visual-admission-app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ipd-visual-admission-app
        run: pnpm install --frozen-lockfile
      - name: Build static dashboard
        working-directory: ipd-visual-admission-app
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ipd-visual-admission-app/out
      - id: deployment
        uses: actions/deploy-pages@v4
